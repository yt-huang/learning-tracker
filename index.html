<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Tracker · 学习计划跟踪系统</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
  <!-- ==================== LOGIN / REGISTER ==================== -->
  <section id="login-screen" class="login-screen">
    <div class="login-card" id="login-card">
      <div class="brand-badge">LT</div>
      <h1>Learning Tracker</h1>
      <p>多用户学习计划生成与跟踪系统</p>
      <!-- Login form -->
      <form id="login-form">
        <label>用户名<input id="username" autocomplete="username" placeholder="admin@cpaas.io" /></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" /></label>
        <button type="submit">登录</button>
        <small id="login-error" class="error"></small>
      </form>
      <div style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted)">
        没有账号？<a href="#" id="show-register" style="color:var(--brand)">注册</a>
      </div>
      <div id="session-warning" class="hidden" style="margin-top:10px;padding:8px;border:1px solid var(--warn);border-radius:8px;font-size:12px;color:var(--warn)"></div>
    </div>

    <!-- Register card (hidden initially) -->
    <div class="login-card hidden" id="register-card">
      <div class="brand-badge">LT</div>
      <h1>注册账号</h1>
      <p>创建账号后即可使用学习跟踪系统</p>
      <form id="register-form">
        <label>用户名<input id="reg-username" placeholder="至少2个字符" minlength="2" required /></label>
        <label>密码<input id="reg-password" type="password" placeholder="至少4个字符" minlength="4" required /></label>
        <label>邮箱（选填）<input id="reg-email" type="email" placeholder="your@email.com" /></label>
        <button type="submit" class="primary">注册</button>
        <small id="register-error" class="error"></small>
      </form>
      <div style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted)">
        已有账号？<a href="#" id="show-login" style="color:var(--brand)">登录</a>
      </div>
    </div>
  </section>

  <!-- ==================== MAIN APP ==================== -->
  <main id="app" class="app hidden">
    <aside class="sidebar">
      <div class="logo"><span>LT</span><strong>Learning Tracker</strong></div>
      <nav>
        <button data-view="dashboard" class="nav-btn active">仪表盘</button>
        <button data-view="plans" class="nav-btn">学习计划</button>
        <button data-view="logs" class="nav-btn">学习日志</button>
        <button data-view="users" class="nav-btn admin-only hidden">用户管理</button>
        <button data-view="data" class="nav-btn">数据管理</button>
      </nav>
      <div id="user-badge" class="user-badge"></div>
      <button id="logout-btn" class="ghost danger">退出登录</button>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <h2 id="view-title">仪表盘</h2>
          <p id="view-subtitle">学习数据来自浏览器 SQLite 数据库</p>
        </div>
        <button id="new-plan-btn" class="primary">+ 从链接生成计划</button>
      </header>

      <section id="dashboard-view" class="view"></section>
      <section id="plans-view" class="view hidden"></section>
      <section id="plan-detail-view" class="view hidden"></section>
      <section id="logs-view" class="view hidden"></section>
      <section id="users-view" class="view hidden"></section>
      <section id="data-view" class="view hidden"></section>
    </section>
  </main>

  <!-- ==================== DIALOGS ==================== -->
  <dialog id="plan-dialog" class="modal">
    <form id="plan-form" method="dialog">
      <h3>从学习链接生成计划</h3>
      <p class="modal-note">快速生成离线可用；AI 深度分析会读取链接内容并生成更贴合资料结构的阶段目标和任务。</p>
      <label>学习链接<input id="source-url" placeholder="https://github.com/luongnv89/claude-howto" required /></label>
      <div class="grid-2">
        <label>计划标题<input id="plan-title" placeholder="留空则自动推断" /></label>
        <label>分类<input id="plan-category" placeholder="AI / DevOps / 编程" /></label>
      </div>
      <label>学习目标<textarea id="plan-goal" rows="3" placeholder="你希望通过这个链接掌握什么？"></textarea></label>
      <div class="grid-2">
        <label>难度
          <select id="plan-difficulty"><option>入门</option><option selected>进阶</option><option>高级</option></select>
        </label>
        <label>预计总小时<input id="plan-hours" type="number" min="1" value="12" /></label>
      </div>
      <div id="ai-analysis-preview" class="ai-preview hidden"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-plan">取消</button>
        <button type="button" class="ghost" id="ai-analyze-plan">AI 深度分析</button>
        <button type="submit" class="primary" id="quick-generate-plan">快速生成并保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-plan-dialog" class="modal">
    <form id="edit-plan-form" method="dialog">
      <h3>编辑计划</h3>
      <input type="hidden" id="edit-plan-id" />
      <label>计划标题<input id="edit-plan-title" required /></label>
      <label>描述<input id="edit-plan-desc" /></label>
      <div class="grid-2">
        <label>分类<input id="edit-plan-category" /></label>
        <label>预计小时<input id="edit-plan-hours" type="number" min="0" step="1" /></label>
      </div>
      <label>链接<input id="edit-plan-url" /></label>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-edit-plan">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal">
    <form method="dialog">
      <h3>确认操作</h3>
      <p id="confirm-msg"></p>
      <div class="modal-actions">
        <button type="button" class="ghost" id="confirm-cancel">取消</button>
        <button type="button" class="danger primary" id="confirm-action">确认</button>
      </div>
    </form>
  </dialog>

  <dialog id="log-dialog" class="modal">
    <form id="log-form" method="dialog">
      <h3>添加学习日志</h3>
      <input type="hidden" id="log-plan-id" />
      <input type="hidden" id="log-task-id" />
      <label>学习摘要<input id="log-summary" required placeholder="今天完成了什么？" /></label>
      <label>学习时长（分钟）<input id="log-duration" type="number" min="1" value="30" /></label>
      <label>笔记<textarea id="log-notes" rows="4" placeholder="关键收获、问题、下一步"></textarea></label>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-log">取消</button>
        <button type="submit" class="primary">写入 SQLite</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-user-dialog" class="modal">
    <form id="edit-user-form" method="dialog">
      <h3>编辑用户</h3>
      <input type="hidden" id="edit-user-id" />
      <label>用户名<input id="edit-user-username" required /></label>
      <label>邮箱<input id="edit-user-email" type="email" /></label>
      <label>角色
        <select id="edit-user-role">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </label>
      <label>新密码（留空不修改）<input id="edit-user-password" type="password" placeholder="留空则不修改密码" /></label>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-edit-user">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loading-text">加载中...</span></div>

  <!-- Task edit dialog -->
  <dialog id="edit-task-dialog" class="modal">
    <form id="edit-task-form" method="dialog">
      <h3>编辑任务</h3>
      <input type="hidden" id="edit-task-id" />
      <input type="hidden" id="edit-task-plan-id" />
      <input type="hidden" id="edit-task-milestone-id" />
      <label>任务标题<input id="edit-task-title" required /></label>
      <label>描述<textarea id="edit-task-desc" rows="2"></textarea></label>
      <div class="grid-2">
        <label>预计时间（分）<input id="edit-task-estimated" type="number" min="1" value="60" /></label>
        <label>优先级
          <select id="edit-task-priority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-edit-task">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>
  <button id="back-to-top" class="back-to-top hidden" onclick="document.getElementById('plan-detail-view')?.scrollIntoView({behavior:'smooth'})">↑</button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
