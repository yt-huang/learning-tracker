services:
  learning-tracker:
    build: .
    image: ghcr.io/yt-huang/learning-tracker:latest
    container_name: learning-tracker
    restart: unless-stopped
    depends_on:
      ai-hub:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    environment:
      PORT: "8010"
      AI_HUB_URL: http://ai-hub:8020
      AI_HUB_TOKEN: ${AI_HUB_INTERNAL_TOKEN:-dev-internal-token}
      AI_HUB_ADMIN_TOKEN: ${AI_HUB_ADMIN_TOKEN:-dev-admin-token}
      AI_HUB_TIMEOUT: ${AI_HUB_TIMEOUT:-300}
      AI_DIRECT_TIMEOUT: ${AI_DIRECT_TIMEOUT:-180}
      MYSQL_HOST: ${DB_HOST:-host.docker.internal}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DB: ${DB_NAME:-learning_tracker}
      MYSQL_USER: ${DB_USER:-lt_user}
      MYSQL_PASS: ${DB_PASSWORD:-LtPass2024!}
      # Legacy direct-provider fallback. Normally leave empty; configure API URL/Key in AI Hub admin UI instead.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  ai-hub:
    build: ./ai-hub
    image: ghcr.io/yt-huang/learning-tracker-ai-hub:latest
    container_name: ai-analysis-hub
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8020"
    environment:
      PORT: "8020"
      DB_ENGINE: mysql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-learning_tracker}
      DB_USER: ${DB_USER:-lt_user}
      DB_PASSWORD: ${DB_PASSWORD:-LtPass2024!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AI_HUB_ADMIN_TOKEN: ${AI_HUB_ADMIN_TOKEN:-dev-admin-token}
      AI_HUB_INTERNAL_TOKEN: ${AI_HUB_INTERNAL_TOKEN:-dev-internal-token}
      AI_HUB_MASTER_KEY: ${AI_HUB_MASTER_KEY:-dev-master-key-change-me}
      HTTP_TIMEOUT: ${AI_PROVIDER_TIMEOUT:-180}
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
