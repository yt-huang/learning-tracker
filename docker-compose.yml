services:
  learning-tracker:
    build: .
    image: ghcr.io/yt-huang/learning-tracker:latest
    container_name: learning-tracker
    restart: unless-stopped
    depends_on:
      ai-hub:
        condition: service_healthy
    ports:
      - "8010:8010"
    environment:
      PORT: "8010"
      AI_HUB_URL: http://ai-hub:8020
      AI_HUB_TOKEN: ${AI_HUB_INTERNAL_TOKEN:-dev-internal-token}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${DB_NAME:-ai_hub}
      MYSQL_USER: ${DB_USER:-ai_hub}
      MYSQL_PASS: ${DB_PASSWORD:-ai_hub_password}
      # Legacy direct-provider fallback. Normally leave empty; configure API URL/Key in AI Hub admin UI instead.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  mysql:
    image: mysql:8.4
    container_name: learning-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_hub_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ai_hub}
      MYSQL_USER: ${DB_USER:-ai_hub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ai_hub_password}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ai_hub_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ai-hub:
    build: ./ai-hub
    image: ghcr.io/yt-huang/learning-tracker-ai-hub:latest
    container_name: ai-analysis-hub
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8020:8020"
    environment:
      PORT: "8020"
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ai_hub}
      DB_USER: ${DB_USER:-ai_hub}
      DB_PASSWORD: ${DB_PASSWORD:-ai_hub_password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AI_HUB_ADMIN_TOKEN: ${AI_HUB_ADMIN_TOKEN:-dev-admin-token}
      AI_HUB_INTERNAL_TOKEN: ${AI_HUB_INTERNAL_TOKEN:-dev-internal-token}
      AI_HUB_MASTER_KEY: ${AI_HUB_MASTER_KEY:-dev-master-key-change-me}
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ai_hub_mysql:
