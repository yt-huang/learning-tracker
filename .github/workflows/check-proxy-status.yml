name: check-proxy-status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose proxy and Docker on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "=== sing-box status ==="
            sudo systemctl status sing-box --no-pager 2>&1 | head -10 || echo "sing-box not found"

            echo "=== sing-box process ==="
            ps aux | grep sing-box | grep -v grep || echo "No sing-box process"

            echo "=== Test proxy directly ==="
            curl -v --max-time 10 -x http://127.0.0.1:10808 https://github.com -o /dev/null 2>&1 | head -10 || echo "curl failed"

            echo "=== Docker proxy env ==="
            sudo systemctl show docker --property=Environment 2>&1

            echo "=== Docker daemon proxy file ==="
            sudo cat /etc/systemd/system/docker.service.d/http-proxy.conf 2>/dev/null || echo "No proxy conf"

            echo "=== Docker info proxy ==="
            sudo docker info 2>&1 | grep -i proxy || echo "No proxy in docker info"

            echo "=== Try ghcr.io pull ==="
            time sudo docker pull ghcr.io/yt-huang/learning-tracker-ai-hub:latest 2>&1 | tail -5 || echo "ghcr pull failed"

            echo "=== Container status ==="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}'
