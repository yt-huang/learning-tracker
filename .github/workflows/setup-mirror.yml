name: setup-docker-mirror

on:
  workflow_dispatch:

jobs:
  setup-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy dkturbo mirror on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            # 1. 拉取并运行 dkturbo 镜像加速器（一次性配置工具）
            echo "=== 拉取并运行 dkturbo ==="
            sudo docker run --rm \
              --name=dkturbo \
              -v /etc/docker:/etc/docker \
              -v /opt:/opt \
              -e MODE=registry \
              -e REGISTRY=auto \
              --network=bridge \
              --pid=host \
              --privileged \
              registry.cn-shenzhen.aliyuncs.com/cp0204/dkturbo:main || true

            # 2. 检查 daemon.json 是否已更新
            echo "=== 当前 Docker daemon 配置 ==="
            sudo cat /etc/docker/daemon.json 2>/dev/null || echo "{}"

            # 3. 重启 Docker 使镜像加速生效
            echo "=== 重启 Docker daemon ==="
            sudo systemctl restart docker || sudo service docker restart || true
            sleep 5

            # 4. 验证 Docker 正常
            echo "=== Docker info (Registry Mirrors) ==="
            sudo docker info 2>&1 | grep -A5 "Registry Mirrors" || echo "未检测到镜像加速配置"

            echo "=== Docker 容器状态 ==="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}'

            echo "=== 镜像加速器部署完成 ==="
