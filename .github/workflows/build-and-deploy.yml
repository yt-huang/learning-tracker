name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/yt-huang/learning-tracker
  AI_HUB_IMAGE: ghcr.io/yt-huang/learning-tracker-ai-hub
  APP_DIR: /opt/learning-tracker
  APP_PORT: "8010"
  AI_HUB_PORT: "8020"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push learning-tracker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=learning-tracker
          cache-to: type=gha,mode=max,scope=learning-tracker
      - name: Build and push ai-hub
        uses: docker/build-push-action@v6
        with:
          context: ./ai-hub
          push: true
          tags: |
            ${{ env.AI_HUB_IMAGE }}:latest
            ${{ env.AI_HUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-hub
          cache-to: type=gha,mode=max,scope=ai-hub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on server with docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 22m
          script: |
            set -euo pipefail
            APP_DIR=${{ env.APP_DIR }}
            APP_PORT=${{ env.APP_PORT }}
            AI_HUB_PORT=${{ env.AI_HUB_PORT }}
            APP_IMAGE=${{ env.APP_IMAGE }}:latest
            AI_HUB_IMAGE=${{ env.AI_HUB_IMAGE }}:latest
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER:$USER" "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              cat > .env <<ENV
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=admin
            AI_HUB_ADMIN_TOKEN=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(32))
            PY
            )
            AI_HUB_INTERNAL_TOKEN=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(32))
            PY
            )
            AI_HUB_MASTER_KEY=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(48))
            PY
            )
            ENV
              chmod 600 .env
            fi

            get_container_env() {
              local name="$1" key="$2"
              sudo docker inspect "$name" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | awk -F= -v k="$key" '$1==k {sub("^[^=]*=", ""); print; exit}'
            }

            ensure_env() {
              local key="$1" value="$2"
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            # Reuse the existing backend MySQL on the VM. If the historical mysql-lt
            # container is present, copy its connection settings into .env without
            # printing secret values to the GitHub Actions log.
            EXISTING_DB_NAME="$(get_container_env mysql-lt MYSQL_DATABASE || true)"
            EXISTING_DB_USER="$(get_container_env mysql-lt MYSQL_USER || true)"
            EXISTING_DB_PASSWORD="$(get_container_env mysql-lt MYSQL_PASSWORD || true)"
            ensure_env DB_HOST "host.docker.internal"
            ensure_env DB_PORT "3306"
            ensure_env DB_NAME "${EXISTING_DB_NAME:-learning_tracker}"
            ensure_env DB_USER "${EXISTING_DB_USER:-lt_user}"
            ensure_env DB_PASSWORD "${EXISTING_DB_PASSWORD:-LtPass2024!}"

            cat > docker-compose.yml <<COMPOSE
            services:
              learning-tracker:
                image: ${APP_IMAGE}
                container_name: learning-tracker
                restart: unless-stopped
                depends_on:
                  ai-hub:
                    condition: service_healthy
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                ports:
                  - "${APP_PORT}:8010"
                environment:
                  PORT: "8010"
                  AI_HUB_URL: http://ai-hub:8020
                  AI_HUB_TOKEN: \${AI_HUB_INTERNAL_TOKEN}
                  MYSQL_HOST: \${DB_HOST:-host.docker.internal}
                  MYSQL_PORT: \${DB_PORT:-3306}
                  MYSQL_DB: \${DB_NAME:-learning_tracker}
                  MYSQL_USER: \${DB_USER:-lt_user}
                  MYSQL_PASS: \${DB_PASSWORD:-LtPass2024!}

              ai-hub:
                image: ${AI_HUB_IMAGE}
                container_name: ai-analysis-hub
                restart: unless-stopped
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                ports:
                  - "${AI_HUB_PORT}:8020"
                environment:
                  PORT: "8020"
                  DB_ENGINE: mysql
                  DB_HOST: \${DB_HOST:-host.docker.internal}
                  DB_PORT: \${DB_PORT:-3306}
                  DB_NAME: \${DB_NAME:-learning_tracker}
                  DB_USER: \${DB_USER:-lt_user}
                  DB_PASSWORD: \${DB_PASSWORD:-LtPass2024!}
                  ADMIN_USERNAME: \${ADMIN_USERNAME:-admin}
                  ADMIN_PASSWORD: \${ADMIN_PASSWORD:-admin}
                  AI_HUB_ADMIN_TOKEN: \${AI_HUB_ADMIN_TOKEN}
                  AI_HUB_INTERNAL_TOKEN: \${AI_HUB_INTERNAL_TOKEN}
                  AI_HUB_MASTER_KEY: \${AI_HUB_MASTER_KEY}
                healthcheck:
                  test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()\nPY"]
                  interval: 10s
                  timeout: 5s
                  retries: 12
                  start_period: 20s
            COMPOSE
            sudo docker compose pull
            sudo docker rm -f learning-tracker ai-analysis-hub learning-tracker-mysql 2>/dev/null || true
            sudo docker compose up -d
            sudo docker image prune -f
            sudo docker compose ps
