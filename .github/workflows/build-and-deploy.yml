name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/yt-huang/learning-tracker
  AI_HUB_IMAGE: ghcr.io/yt-huang/learning-tracker-ai-hub
  APP_DIR: /opt/learning-tracker
  APP_PORT: "8010"
  AI_HUB_PORT: "8020"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: learning_tracker
          MYSQL_USER: lt_user
          MYSQL_PASSWORD: LtTest2024!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_root_pass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          pip install pymysql cryptography pytest
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -ptest_root_pass --silent && break
            sleep 2
          done
      - name: Run API tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DB: learning_tracker
          MYSQL_USER: lt_user
          MYSQL_PASS: LtTest2024!
          PORT: 18010
          ADMIN_USERNAME: admin@cpaas.io
          ADMIN_PASSWORD: K8sMysql2024!
          TEST_BASE_URL: http://127.0.0.1:18010
          TEST_USER: admin@cpaas.io
          TEST_PASS: K8sMysql2024!
        run: |
          python3 server/server.py &
          SERVER_PID=$!
          # Wait for server to start (init_mysql creates tables)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18010/ >/dev/null 2>&1 && break
            sleep 2
          done
          # Verify server is up
          curl -sf http://127.0.0.1:18010/ >/dev/null || { echo "SERVER FAILED TO START"; kill $SERVER_PID 2>/dev/null; exit 1; }
          # Run tests
          TEST_BASE_URL=http://127.0.0.1:18010 TEST_USER=admin@cpaas.io TEST_PASS=K8sMysql2024! python3 -m pytest tests/ -v || {
            echo "TESTS FAILED"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }
          kill $SERVER_PID 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push learning-tracker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=learning-tracker
          cache-to: type=gha,mode=max,scope=learning-tracker
      - name: Build and push ai-hub
        uses: docker/build-push-action@v6
        with:
          context: ./ai-hub
          push: true
          tags: |
            ${{ env.AI_HUB_IMAGE }}:latest
            ${{ env.AI_HUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-hub
          cache-to: type=gha,mode=max,scope=ai-hub

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on server with docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 22m
          script: |
            set -euo pipefail
            APP_DIR=${{ env.APP_DIR }}
            APP_PORT=${{ env.APP_PORT }}
            AI_HUB_PORT=${{ env.AI_HUB_PORT }}
            APP_IMAGE=${{ env.APP_IMAGE }}:latest
            AI_HUB_IMAGE=${{ env.AI_HUB_IMAGE }}:latest
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER:$USER" "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              cat > .env <<ENV
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=admin
            AI_HUB_ADMIN_TOKEN=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(32))
            PY
            )
            AI_HUB_INTERNAL_TOKEN=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(32))
            PY
            )
            AI_HUB_MASTER_KEY=$(python3 - <<'PY'
            import secrets; print(secrets.token_urlsafe(48))
            PY
            )
            ENV
              chmod 600 .env
            fi

            get_container_env() {
              local name="$1" key="$2"
              sudo docker inspect "$name" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | awk -F= -v k="$key" '$1==k {sub("^[^=]*=", ""); print; exit}'
            }

            ensure_env() {
              local key="$1" value="$2"
              if ! grep -q "^${key}=" .env; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            # Reuse the existing backend MySQL on the VM. If the historical mysql-lt
            # container is present, copy its connection settings into .env without
            # printing secret values to the GitHub Actions log.
            EXISTING_DB_NAME="$(get_container_env mysql-lt MYSQL_DATABASE || true)"
            EXISTING_DB_USER="$(get_container_env mysql-lt MYSQL_USER || true)"
            EXISTING_DB_PASSWORD="$(get_container_env mysql-lt MYSQL_PASSWORD || true)"
            ensure_env DB_HOST "host.docker.internal"
            ensure_env DB_PORT "3306"
            ensure_env DB_NAME "${EXISTING_DB_NAME:-learning_tracker}"
            ensure_env DB_USER "${EXISTING_DB_USER:-lt_user}"
            ensure_env DB_PASSWORD "${EXISTING_DB_PASSWORD:-LtPass2024!}"

            cat > docker-compose.yml <<COMPOSE
            services:
              learning-tracker:
                image: ${APP_IMAGE}
                container_name: learning-tracker
                restart: unless-stopped
                depends_on:
                  ai-hub:
                    condition: service_healthy
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                ports:
                  - "${APP_PORT}:8010"
                environment:
                  PORT: "8010"
                  AI_HUB_URL: http://ai-hub:8020
                  AI_HUB_TOKEN: \${AI_HUB_INTERNAL_TOKEN}
                  AI_HUB_ADMIN_TOKEN: \${AI_HUB_ADMIN_TOKEN}
                  AI_HUB_TIMEOUT: \${AI_HUB_TIMEOUT:-300}
                  AI_DIRECT_TIMEOUT: \${AI_DIRECT_TIMEOUT:-180}
                  MYSQL_HOST: \${DB_HOST:-host.docker.internal}
                  MYSQL_PORT: \${DB_PORT:-3306}
                  MYSQL_DB: \${DB_NAME:-learning_tracker}
                  MYSQL_USER: \${DB_USER:-lt_user}
                  MYSQL_PASS: \${DB_PASSWORD:-LtPass2024!}

              ai-hub:
                image: ${AI_HUB_IMAGE}
                container_name: ai-analysis-hub
                restart: unless-stopped
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                expose:
                  - "8020"
                environment:
                  PORT: "8020"
                  DB_ENGINE: mysql
                  DB_HOST: \${DB_HOST:-host.docker.internal}
                  DB_PORT: \${DB_PORT:-3306}
                  DB_NAME: \${DB_NAME:-learning_tracker}
                  DB_USER: \${DB_USER:-lt_user}
                  DB_PASSWORD: \${DB_PASSWORD:-LtPass2024!}
                  ADMIN_USERNAME: \${ADMIN_USERNAME:-admin}
                  ADMIN_PASSWORD: \${ADMIN_PASSWORD:-admin}
                  AI_HUB_ADMIN_TOKEN: \${AI_HUB_ADMIN_TOKEN}
                  AI_HUB_INTERNAL_TOKEN: \${AI_HUB_INTERNAL_TOKEN}
                  AI_HUB_MASTER_KEY: \${AI_HUB_MASTER_KEY}
                  HTTP_TIMEOUT: \${AI_PROVIDER_TIMEOUT:-180}
                healthcheck:
                  test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()\nPY"]
                  interval: 10s
                  timeout: 5s
                  retries: 12
                  start_period: 20s
            COMPOSE
            sudo docker compose pull
            sudo docker rm -f learning-tracker ai-analysis-hub learning-tracker-mysql 2>/dev/null || true
            sudo docker compose up -d
            sudo docker image prune -f
            sudo docker compose ps
